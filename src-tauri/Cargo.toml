[package]
name = "shhd-deploy"
version = "0.1.0"
description = "胡桃部署运维工具：隧道 / 后端部署 / 前端部署 / Docker 部署"
edition = "2021"

[lib]
name = "kurumi_deploy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
russh = "0.46"
russh-sftp = "2"
zip = "2"
ignore = "0.4"
walkdir = "2"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
encoding_rs = "0.8"
base64 = "0.22"

[profile.release]
# 减小体积、降低内存占用
opt-level = "s"
lto = true
codegen-units = 1
strip = true
